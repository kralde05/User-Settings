<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <input type="checkbox" id="settings-toggle" class="modal-toggle">
  
  <label for="settings-toggle" class="btn-open">Open Settings</label>
 
  <div class="settings-box">
    <form>
      <fieldset>
        
        <div class="profile-upload-section">
          <div class="avatar-preview">U</div>
          <div class="profile-info">
            <div class="profile-display-name">Username</div>
            <label class="file-input-btn">
              Change Avatar
              <input type="file" accept="image/*">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="display-name">Display Name</label>
          <input type="text" id="display-name" placeholder="Enter your display name">
        </div>

        <div class="form-group">
          <label for="bio">About Me</label>
          <div class="hint-text">A short description about yourself.</div>
          <textarea id="bio" placeholder="Write something..."></textarea>
        </div>

        <div class="form-group">
          <label>Preferences</label>
          <div class="choice-group">
            <label><input type="radio" name="pref" checked> Option 1</label>
            <label><input type="radio" name="pref"> Option 2</label>
          </div>
        </div>
       
        <div class="action-row">
          <label for="settings-toggle" class="btn-cancel">Cancel</label>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>

      </fieldset>
    </form>
  </div>

</body>
</html>
